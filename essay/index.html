<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>전체 글 | 코드 없는 쉬운 설명</title>

  <meta
    name="description"
    content="코드 없는 쉬운 설명의 전체 글 목록입니다."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #e9dfca;
      --paper: #fbf7ec;
      --paper-dark: #f1e6d1;
      --ink: #302a23;
      --muted: #766c5e;
      --accent: #984f3e;
      --accent-dark: #74392d;
      --line: #d7c8aa;
      --shadow: rgba(75, 59, 38, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 18px;
      color: var(--ink);
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255, 255, 255, 0.55),
          transparent 34%
        ),
        linear-gradient(135deg, #e6dbc5, #eee5d3);
      font-family: "Noto Sans KR", sans-serif;
      line-height: 1.75;
    }

    .page {
      width: min(100%, 900px);
      min-height: calc(100vh - 64px);
      margin: 0 auto;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(113, 89, 58, 0.2);
      border-radius: 4px;
      box-shadow: 0 22px 60px var(--shadow);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 52px;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      color: var(--ink);
      font-family: "Noto Serif KR", serif;
      font-weight: 700;
      text-decoration: none;
    }

    header nav a {
      color: var(--muted);
      font-size: 0.92rem;
      text-decoration: none;
    }

    header nav a:hover {
      color: var(--accent);
    }

    main {
      padding: 76px 52px 90px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif KR", serif;
      font-size: clamp(2.4rem, 7vw, 4.4rem);
      line-height: 1.25;
      letter-spacing: -0.05em;
    }

    .introduction {
      max-width: 610px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
      word-break: keep-all;
    }

    .list-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 76px 0 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .list-heading h2 {
      margin: 0;
      font-family: "Noto Serif KR", serif;
      font-size: 1.75rem;
    }

    .list-heading span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .article-card {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 28px;
      align-items: center;
      padding: 34px;
      color: var(--ink);
      background: var(--paper-dark);
      border: 1px solid var(--line);
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease,
        background 160ms ease;
    }

    .article-card:hover {
      transform: translateY(-4px);
      background: #f5ead5;
      border-color: var(--accent);
      box-shadow: 0 14px 30px rgba(75, 59, 38, 0.13);
    }

    .article-card:focus-visible {
      outline: 3px solid rgba(152, 79, 62, 0.35);
      outline-offset: 5px;
    }

    .number {
      color: var(--accent);
      font-family: "Noto Serif KR", serif;
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1;
    }

    .category {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.15em;
    }

    .article-card h3 {
      margin: 0;
      font-family: "Noto Serif KR", serif;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      line-height: 1.4;
      word-break: keep-all;
    }

    .summary {
      margin: 14px 0 0;
      color: var(--muted);
      word-break: keep-all;
    }

    .meta {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .arrow {
      color: var(--accent);
      font-family: serif;
      font-size: 2rem;
      transition: transform 160ms ease;
    }

    .article-card:hover .arrow {
      transform: translateX(5px);
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 52px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 0.82rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 680px) {
      body {
        padding: 0;
      }

      .page {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      header {
        padding: 20px 22px;
      }

      main {
        padding: 62px 24px 72px;
      }

      .list-heading {
        margin-top: 58px;
      }

      .article-card {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 28px 24px;
      }

      .number {
        font-size: 2.2rem;
      }

      .arrow {
        display: none;
      }

      footer {
        flex-direction: column;
        padding: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .article-card,
      .arrow {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <a class="wordmark" href="../">코드 없는 쉬운 설명</a>

      <nav aria-label="주요 메뉴">
        <a href="../">처음으로</a>
      </nav>
    </header>

    <main>
      <section>
        <p class="eyebrow">ALL ESSAYS</p>
        <h1>전체 글</h1>

        <p class="introduction">
          AI와 기술을 코드 없이 쉽게 설명합니다.
          처음부터 순서대로 읽어도 좋고, 궁금한 제목부터 골라도 좋습니다.
        </p>
      </section>

      <section aria-labelledby="article-list-title">
        <div class="list-heading">
          <h2 id="article-list-title">글 목록</h2>
          <span>총 1편</span>
        </div>

        <a
          class="article-card"
          href="001-how-ai-learns.html"
          aria-label="01. AI는 어떻게 학습하는가? 읽기"
        >
          <span class="number">01</span>

          <div>
            <p class="category">MACHINE LEARNING</p>
            <h3>AI는 어떻게 학습하는가?</h3>

            <p class="summary">
              초보 어부의 이야기로 알아보는 머신러닝의 원리
            </p>

            <p class="meta">
              2026년 9월 18일 · 이홍재 · 약 6분
            </p>
          </div>

          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </section>
    </main>

    <footer>
      <span>© 2026 코드 없는 쉬운 설명</span>
      <a href="../">첫 화면으로 돌아가기</a>
    </footer>
  </div>
</body>
</html>
